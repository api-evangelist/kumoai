apis:
- aid: kumoai-rest-api
  name: Kumo REST API
  description: Automate and schedule predictive query training and batch predictions.
    Retrain a predictive query (re-ingesting data from the source), trigger recurring
    batch predictions, monitor job status and evaluation metrics, and cancel in-progress
    jobs. Authenticates with a tenant-scoped X-API-Key header.
  humanURL: https://docs.nvidia.com/sdgm/rest-api
  baseURL: https://<customer_id>.kumoai.cloud/api
  x-baseURL-note: The public API URL is tenant-scoped; SPCS deployments use https://<kumo_spcs_deployment_url>/api.
  tags:
  - Machine-Learning
  - Batch Prediction
  - Job
  tags_raw:
  - Machine Learning
  - Batch Prediction
  - Jobs
  properties:
  - type: Documentation
    url: https://docs.nvidia.com/sdgm/rest-api
  - type: Authentication
    url: ../authentication/kumoai-authentication.yml
- aid: kumoai-rfm-mcp
  name: KumoRFM MCP Server
  description: Open-source Model Context Protocol server that empowers AI assistants
    with KumoRFM. Builds, manages, and visualizes relational graphs directly from CSV
    or Parquet files, converts natural language into PQL queries, and runs training-free
    predictions, evaluations, and explanations. Runs over stdio or streamable-http
    and is distributed on PyPI and as an MCPB bundle.
  humanURL: https://github.com/kumo-ai/kumo-rfm-mcp
  baseURL: https://kumorfm.ai
  tags:
  - MCP
  - Agents
  - Predictions
  tags_raw:
  - Model Context Protocol
  - Agents
  - Predictions
