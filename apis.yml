aid: kumoai
name: Kumo.AI
description: 'Kumo.AI builds predictive AI for relational data. Its flagship model,
  KumoRFM, is a pre-trained Relational Foundation Model that generates training-free
  predictions over multi-table data by interpreting a data warehouse as a temporal
  heterogeneous graph, queried through a SQL-like Predictive Query Language (PQL).
  Kumo exposes this through a Python SDK (kumoai), a REST API for automating retraining
  and batch predictions, an open-source Model Context Protocol server (kumo-rfm-mcp)
  for agentic workflows, and a published Agent Skills catalog. It ships as SaaS, VPC/BYOC,
  a Snowflake Native Application, and a Databricks Native Application. Kumo product
  documentation is now hosted by NVIDIA under Structured Data and Graph Models.'
